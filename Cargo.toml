[workspace]
resolver = "2"
members = [
    "crates/arena2",
    "crates/dagger-import",
    "crates/dagger-rpg",
    "crates/dagger-runtime",
    "crates/dagger-studio-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
core-ids = { git = "https://github.com/FuzzySlipper/rusty-engine.git", branch = "main" }
core-math = { git = "https://github.com/FuzzySlipper/rusty-engine.git", branch = "main" }
core-space = { git = "https://github.com/FuzzySlipper/rusty-engine.git", branch = "main" }
engine-spatial = { git = "https://github.com/FuzzySlipper/rusty-engine.git", branch = "main" }
entity-state = { git = "https://github.com/FuzzySlipper/rusty-engine.git", branch = "main" }
svc-collision = { git = "https://github.com/FuzzySlipper/rusty-engine.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
warnings = "warn"

[workspace.lints.clippy]
warnings = "warn"
