[workspace]
resolver = "2"
members = [
    "crates/arena2",
    "crates/dagger-import",
    "crates/dagger-rpg",
    "crates/dagger-runtime",
    "crates/dagger-studio-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
rusty-engine = { path = "../rusty-engine/rust/crates/rusty-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
warnings = "warn"
