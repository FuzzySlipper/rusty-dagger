[workspace]
resolver = "2"
members = [
    "crates/arena2",
    "crates/dagger-import",
    "crates/dagger-rpg",
    "crates/dagger-runtime",
    "crates/dagger-studio-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
gtk = "0.18"
rusty-engine = { git = "https://github.com/FuzzySlipper/rusty-engine.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
winit = "0.30"

[workspace.metadata.rusty-engine]
repository = "https://github.com/FuzzySlipper/rusty-engine.git"
revision = "d0b5e672b83d463bff71d8d35c877f770142ff3c"

[workspace.lints.rust]
warnings = "warn"
