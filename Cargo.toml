[workspace]
resolver = "2"
members = [
    "crates/arena2",
    "crates/dagger-import",
    "crates/dagger-runtime",
    "crates/dagger-studio-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
core-ids = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "880a119466faebbf19ed05e39206ff4ba87237a2" }
core-math = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "880a119466faebbf19ed05e39206ff4ba87237a2" }
core-space = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "880a119466faebbf19ed05e39206ff4ba87237a2" }
engine-spatial = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "880a119466faebbf19ed05e39206ff4ba87237a2" }
entity-state = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "880a119466faebbf19ed05e39206ff4ba87237a2" }
svc-collision = { git = "https://github.com/FuzzySlipper/rusty-engine.git", rev = "880a119466faebbf19ed05e39206ff4ba87237a2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
