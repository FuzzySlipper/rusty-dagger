[package]
name = "dagger-studio-adapter"
version.workspace = true
edition.workspace = true
description = "Rusty Dagger protocol-14 Studio adapter and renderer projection"

[dependencies]
anyhow.workspace = true
dagger-runtime = { path = "../dagger-runtime" }
rusty-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true

[lib]
name = "dagger_studio_adapter"
path = "src/lib.rs"

[[bin]]
name = "dagger-studio-adapter"
path = "src/bin/dagger-studio-adapter.rs"

[[bin]]
name = "dagger-native-host"
path = "src/bin/dagger-native-host/main.rs"
