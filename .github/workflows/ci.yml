name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision adjacent Rusty Engine checkout
        run: git clone --depth 1 https://github.com/FuzzySlipper/rusty-engine.git ../rusty-engine
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install C# binding prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libclang-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install TypeScript compiler
        run: npm install --global typescript@5.9.3
      - name: Verify active C# product
        run: ./scripts/verify.sh
