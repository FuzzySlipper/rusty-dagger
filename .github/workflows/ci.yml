name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision adjacent Rusty Engine checkout
        run: git clone --depth 1 https://github.com/FuzzySlipper/rusty-engine.git ../rusty-engine
      - name: Install Engine product-host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gstreamer1.0-plugins-base \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-0 \
            chromium \
            ripgrep
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build required Engine rules and renderer artifacts
        run: |
          ../rusty-engine/scripts/verify-rules.sh
          ../rusty-engine/scripts/verify-render.sh
      - name: Build the public Rusty Product CLI
        run: cargo build --manifest-path ../rusty-engine/Cargo.toml -p rusty-cli --locked
      - name: Verify Dagger Product Layout and browser host
        run: ./scripts/verify.sh
